[workspace]
resolver = "2"
members = ["crates/sv-core", "crates/sv-promotion", "crates/sv-paper", "crates/sv-history", "crates/sv-quality", "crates/sv-system", "crates/sv-runner", "crates/sv-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "float_roundtrip"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
